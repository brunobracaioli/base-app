rules:
  - id: base-app.no-session-set-in-migrations
    message: Do not use session-level SET; use transaction-local set_config with a bind.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - '**/*.sql'
    pattern-regex: (?im)^\s*SET\s+(SESSION\s+)?(ROLE|search_path|request\.[A-Za-z_]+|app\.[A-Za-z_]+)\b

  - id: base-app.no-direct-audit-events-insert
    message: Write audit.events only through the platform audit recorder.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - '**/*.sql'
      exclude:
        - /apps/web/src/platform/audit/**
        # Required SQL audit routines; the PostgreSQL AST gate validates their
        # exact signatures/context and rejects any other insert in these files.
        - /supabase/migrations/20261125040643_core_domain_tables.sql
        - /supabase/migrations/20261125040644_audit_and_privacy_routines.sql
        - /supabase/migrations/20261125133733_reject_missing_setting_actors.sql
    pattern-regex: (?im)^\s*INSERT\s+INTO\s+"?audit"?\s*\.\s*"?events"?\b
