packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  '@sentry/cli': false
  dtrace-provider: false
  protobufjs: false

strictDepBuilds: true
minimumReleaseAge: 1440

# Temporary security pins for the Expo/EAS dependency graph. See ADR 0002.
overrides:
  'diff@7.0.0': '9.0.0'
  'glob@>=10.5.0 <14.0.2': '14.0.6'
  'minimatch@>=9.0.0 <11.0.1': '11.0.9'
  'eas-cli@27.11.0>ts-deepmerge': '8.0.0'
  'uuid@7.0.3': '11.1.1'
  'uuid@8.3.2': '11.1.1'
patchedDependencies:
  eas-cli@27.11.0: patches/eas-cli@27.11.0.patch
