name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: CI / workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check module boundaries
        run: pnpm architecture:check

      - name: Lint, type-check, and test current workspace packages
        run: pnpm turbo run lint typecheck test

      - name: Regenerate OpenAPI contract
        run: pnpm contracts:openapi

      - name: Check OpenAPI drift
        run: git diff --exit-code -- docs/reference/openapi.yaml

      - name: Regenerate Supabase configuration
        run: pnpm supabase:config

      - name: Check Supabase configuration drift
        run: git diff --exit-code -- supabase/config.toml

      - name: Check generated Supabase configuration invariants
        run: pnpm supabase:config:check

      - name: Lint extension migrations
        run: pnpm db:lint-migrations

      - name: Check Vercel configuration
        run: pnpm vercel:check

      - name: Test project Semgrep rules
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src \
            --entrypoint semgrep \
            semgrep/semgrep@sha256:25251de66c3b0fdea1c1c519bbc130170349f3da79edd517335b847f30d3c493 \
            --test --config .semgrep/base-app.yml .semgrep/tests/base-app.ts
          docker run --rm --volume "$PWD:/src" --workdir /src \
            --entrypoint semgrep \
            semgrep/semgrep@sha256:25251de66c3b0fdea1c1c519bbc130170349f3da79edd517335b847f30d3c493 \
            --test --config .semgrep/sql.yml .semgrep/tests/sql-rules.sql

      - name: Scan current source with project Semgrep rules
        run: |
          targets=()
          for path in apps packages supabase; do
            if [ -d "$path" ]; then
              targets+=("$path")
            fi
          done
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No source directories are available for Semgrep."
            exit 1
          fi
          docker run --rm --volume "$PWD:/src" --workdir /src \
            --entrypoint semgrep \
            semgrep/semgrep@sha256:25251de66c3b0fdea1c1c519bbc130170349f3da79edd517335b847f30d3c493 \
            scan --error --config .semgrep "${targets[@]}"

  secrets:
    name: CI / secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with Gitleaks
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --exit-code 1

  zizmor:
    name: CI / workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit repository workflows
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: .github/
          strict-collection: true
          version: 1.33.1
          advanced-security: false

      - name: Verify zizmor rejects pull_request_target
        id: zizmor-unsafe-fixture
        continue-on-error: true
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: packages/tooling/src/security/fixtures/zizmor/pull-request-target.yml
          strict-collection: true
          fail-on-no-inputs: false
          online-audits: false
          version: 1.33.1
          advanced-security: false

      - name: Assert unsafe workflow fixture failed
        env:
          ZIZMOR_FIXTURE_OUTCOME: ${{ steps.zizmor-unsafe-fixture.outcome }}
        run: test "$ZIZMOR_FIXTURE_OUTCOME" = failure

  osv:
    name: CI / dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependency lockfiles with OSV-Scanner v2.7.1
        run: >-
          docker run --rm --volume "$PWD:/src" --workdir /src
          ghcr.io/google/osv-scanner@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde
          scan source --recursive /src

  required:
    name: CI / verify
    if: always()
    needs: [workspace, secrets, zizmor, osv]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI gate to pass
        env:
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          OSV_RESULT: ${{ needs.osv.result }}
        run: |
          if [ "$WORKSPACE_RESULT" != "success" ] || \
             [ "$SECRETS_RESULT" != "success" ] || \
             [ "$ZIZMOR_RESULT" != "success" ] || \
             [ "$OSV_RESULT" != "success" ]; then
            echo "One or more required CI gates failed or were skipped."
            exit 1
          fi
