project_id = "base-app"

[api]
enabled = false

[auth]
site_url = "https://example.invalid"
additional_redirect_urls = []
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_length = 10
otp_expiry = 300

[auth.email.template.confirmation]
subject = "{{ if eq (printf \"%T\" .Data.locale) \"string\" }}{{ if eq .Data.locale \"en\" }}Your sign-in code{{ else if eq .Data.locale \"es\" }}Tu código de acceso{{ else }}Seu código de acesso{{ end }}{{ else }}Seu código de acesso{{ end }}"
content_path = "./supabase/templates/auth-code.html"

[auth.email.template.magic_link]
subject = "{{ if eq (printf \"%T\" .Data.locale) \"string\" }}{{ if eq .Data.locale \"en\" }}Your sign-in code{{ else if eq .Data.locale \"es\" }}Tu código de acceso{{ else }}Seu código de acesso{{ end }}{{ else }}Seu código de acesso{{ end }}"
content_path = "./supabase/templates/auth-code.html"

[auth.email.template.recovery]
subject = "{{ if eq (printf \"%T\" .Data.locale) \"string\" }}{{ if eq .Data.locale \"en\" }}Your sign-in code{{ else if eq .Data.locale \"es\" }}Tu código de acceso{{ else }}Seu código de acesso{{ end }}{{ else }}Seu código de acesso{{ end }}"
content_path = "./supabase/templates/auth-code.html"

[auth.email.template.email_change]
subject = "{{ if eq (printf \"%T\" .Data.locale) \"string\" }}{{ if eq .Data.locale \"en\" }}Your sign-in code{{ else if eq .Data.locale \"es\" }}Tu código de acceso{{ else }}Seu código de acesso{{ end }}{{ else }}Seu código de acesso{{ end }}"
content_path = "./supabase/templates/auth-code.html"

[auth.email.template.reauthentication]
subject = "{{ if eq (printf \"%T\" .Data.locale) \"string\" }}{{ if eq .Data.locale \"en\" }}Your sign-in code{{ else if eq .Data.locale \"es\" }}Tu código de acceso{{ else }}Seu código de acesso{{ end }}{{ else }}Seu código de acesso{{ end }}"
content_path = "./supabase/templates/auth-code.html"

[auth.email.notification.password_changed]
enabled = true
subject = "{{ if eq (printf \"%T\" .Data.locale) \"string\" }}{{ if eq .Data.locale \"en\" }}Password changed{{ else if eq .Data.locale \"es\" }}Contraseña cambiada{{ else }}Senha alterada{{ end }}{{ else }}Senha alterada{{ end }}"
content_path = "./templates/password-changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "{{ if eq (printf \"%T\" .Data.locale) \"string\" }}{{ if eq .Data.locale \"en\" }}Email changed{{ else if eq .Data.locale \"es\" }}Correo electrónico cambiado{{ else }}E-mail alterado{{ end }}{{ else }}E-mail alterado{{ end }}"
content_path = "./templates/email-changed.html"

[auth.email.smtp]
enabled = false
host = "env(SMTP_HOST)"
pass = "env(RESEND_SMTP_PASSWORD)"

[auth.rate_limit]
email_sent = 60
sign_in_sign_ups = 30
token_verifications = 10

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/identity/before_user_created"

[auth.external.apple]
enabled = false

[auth.external.azure]
enabled = false

[auth.external.bitbucket]
enabled = false

[auth.external.discord]
enabled = false

[auth.external.facebook]
enabled = false

[auth.external.github]
enabled = false

[auth.external.gitlab]
enabled = false

[auth.external.google]
enabled = false

[auth.external.keycloak]
enabled = false

[auth.external.linkedin_oidc]
enabled = false

[auth.external.notion]
enabled = false

[auth.external.twitch]
enabled = false

[auth.external.twitter]
enabled = false

[auth.external.x]
enabled = false

[auth.external.slack_oidc]
enabled = false

[auth.external.spotify]
enabled = false

[auth.external.workos]
enabled = false

[auth.external.zoom]
enabled = false

[auth.sms]
enabled = false
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false

[auth.oauth_server]
enabled = false

[auth.web3.solana]
enabled = false

[auth.sessions]
timebox = "720h"
inactivity_timeout = "168h"

[auth.captcha]
enabled = false

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 15
max_client_conn = 200

[realtime]
enabled = false

[storage]
enabled = false

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326
