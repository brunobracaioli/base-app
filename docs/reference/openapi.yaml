components:
  schemas:
    AppConfigResponse:
      additionalProperties: false
      properties:
        legal:
          additionalProperties: false
          properties:
            privacyUrl:
              format: uri
              type: string
            privacyVersion:
              pattern: ^\d{4}-\d{2}-\d{2}$
              type: string
            termsUrl:
              format: uri
              type: string
            termsVersion:
              pattern: ^\d{4}-\d{2}-\d{2}$
              type: string
          required:
            - termsVersion
            - privacyVersion
            - termsUrl
            - privacyUrl
          type: object
        maintenance:
          additionalProperties: false
          properties:
            active:
              type: boolean
            messageKey:
              type: string
            platforms:
              items:
                enum:
                  - ios
                  - android
                type: string
              type: array
            until:
              anyOf:
                - format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  type: string
                - type: "null"
          required:
            - active
            - platforms
            - messageKey
            - until
          type: object
        versions:
          additionalProperties: false
          properties:
            android:
              additionalProperties: false
              properties:
                latest:
                  pattern: ^\d+\.\d+\.\d+$
                  type: string
                minSupported:
                  pattern: ^\d+\.\d+\.\d+$
                  type: string
                storeUrl:
                  format: uri
                  type: string
              required:
                - minSupported
                - latest
                - storeUrl
              type: object
            ios:
              additionalProperties: false
              properties:
                latest:
                  pattern: ^\d+\.\d+\.\d+$
                  type: string
                minSupported:
                  pattern: ^\d+\.\d+\.\d+$
                  type: string
                storeUrl:
                  format: uri
                  type: string
              required:
                - minSupported
                - latest
                - storeUrl
              type: object
          required:
            - ios
            - android
          type: object
      required:
        - versions
        - maintenance
        - legal
      type: object
    ConsentBody:
      additionalProperties: false
      properties:
        document:
          enum:
            - terms
            - privacy
          type: string
        version:
          pattern: ^\d{4}-\d{2}-\d{2}$
          type: string
      required:
        - document
        - version
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        status:
          const: ok
          type: string
      required:
        - status
      type: object
    Me:
      additionalProperties: false
      properties:
        consents:
          additionalProperties: false
          properties:
            needsAcceptance:
              items:
                enum:
                  - terms
                  - privacy
                type: string
              type: array
          required:
            - needsAcceptance
          type: object
        createdAt:
          description: Creation time of the identity.profiles row.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        displayName:
          anyOf:
            - maxLength: 80
              minLength: 1
              type: string
            - type: "null"
        email:
          anyOf:
            - format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              type: string
            - type: "null"
        id:
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          type: string
        locale:
          enum:
            - pt-BR
            - en
            - es
          type: string
      required:
        - id
        - email
        - displayName
        - locale
        - createdAt
        - consents
      type: object
    ProblemDetails:
      additionalProperties: false
      properties:
        code:
          pattern: ^[a-z][a-z0-9]*(?:\.[a-z][a-z0-9_]*)+$
          type: string
        detail:
          minLength: 1
          type: string
        entitlement:
          minLength: 1
          type: string
        instance:
          minLength: 1
          type: string
        requestId:
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        status:
          maximum: 599
          minimum: 100
          type: integer
        title:
          minLength: 1
          type: string
        type:
          minLength: 1
          type: string
      required:
        - type
        - title
        - status
        - code
        - requestId
      type: object
    UpdateProfileBody:
      additionalProperties: false
      properties:
        displayName:
          anyOf:
            - maxLength: 80
              minLength: 1
              type: string
            - type: "null"
        locale:
          enum:
            - pt-BR
            - en
            - es
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: "Compatible additive revision: adds public app configuration and server gate responses for existing operations."
  title: base-app API
  version: 1.2.0
openapi: 3.1.0
paths:
  /v1/app-config:
    get:
      operationId: getAppConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfigResponse"
          description: The current public app configuration.
          headers:
            Cache-Control:
              description: Shared cache policy for remote app configuration.
              schema:
                const: public, s-maxage=60, stale-while-revalidate=60
                type: string
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request exceeded the configured rate limit.
      security: []
      summary: Read the public remote app configuration
      x-rate-limit-failure: open
      x-rate-limit-ip-limit: 60
      x-rate-limit-key: ip
      x-rate-limit-limit: 60
      x-rate-limit-window-sec: 60
  /v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: The service is healthy.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request exceeded the configured rate limit.
      security: []
      summary: Health check
      x-rate-limit-failure: open
      x-rate-limit-ip-limit: 60
      x-rate-limit-key: ip
      x-rate-limit-limit: 60
      x-rate-limit-window-sec: 60
  /v1/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: The authenticated user profile and consent state.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The authentication token is missing, invalid, expired, or belongs to a deleted account.
        "426":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The installed app version is below the minimum supported version.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request exceeded the configured rate limit.
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The app is in maintenance mode, or authentication or rate limiting is unavailable.
          headers:
            Retry-After:
              description: For app.maintenance, retry after this many seconds.
              schema:
                const: "60"
                type: string
      security:
        - bearerAuth: []
      summary: Read the authenticated user profile and consent state
      x-rate-limit-failure: closed
      x-rate-limit-ip-limit: 120
      x-rate-limit-key: user
      x-rate-limit-limit: 60
      x-rate-limit-window-sec: 60
    patch:
      operationId: updateMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
        description: Profile fields to update. At least one field is required.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: The updated authenticated user profile and consent state.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request body failed validation.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The authentication token is missing, invalid, expired, or belongs to a deleted account.
        "426":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The installed app version is below the minimum supported version.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request exceeded the configured rate limit.
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The app is in maintenance mode, or authentication or rate limiting is unavailable.
          headers:
            Retry-After:
              description: For app.maintenance, retry after this many seconds.
              schema:
                const: "60"
                type: string
      security:
        - bearerAuth: []
      summary: Update the authenticated user profile
      x-rate-limit-failure: closed
      x-rate-limit-ip-limit: 120
      x-rate-limit-key: user
      x-rate-limit-limit: 20
      x-rate-limit-window-sec: 60
  /v1/me/consents:
    post:
      operationId: acceptConsent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentBody"
        description: The legal document and current version being accepted.
        required: true
      responses:
        "204":
          description: The consent was accepted or had already been accepted.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request body failed validation.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The authentication token is missing, invalid, expired, or belongs to a deleted account.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The submitted legal document version is no longer current.
        "426":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The installed app version is below the minimum supported version.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request exceeded the configured rate limit.
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The app is in maintenance mode, or authentication or rate limiting is unavailable.
          headers:
            Retry-After:
              description: For app.maintenance, retry after this many seconds.
              schema:
                const: "60"
                type: string
      security:
        - bearerAuth: []
      summary: Record acceptance of a current legal document version
      x-rate-limit-failure: closed
      x-rate-limit-ip-limit: 120
      x-rate-limit-key: user
      x-rate-limit-limit: 20
      x-rate-limit-window-sec: 3600
servers:
  - url: /api
