components:
  schemas:
    HealthResponse:
      additionalProperties: false
      properties:
        status:
          const: ok
          type: string
      required:
        - status
      type: object
    ProblemDetails:
      additionalProperties: false
      properties:
        code:
          pattern: ^[a-z][a-z0-9]*(?:\.[a-z][a-z0-9_]*)+$
          type: string
        detail:
          minLength: 1
          type: string
        entitlement:
          minLength: 1
          type: string
        instance:
          minLength: 1
          type: string
        requestId:
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        status:
          maximum: 599
          minimum: 100
          type: integer
        title:
          minLength: 1
          type: string
        type:
          minLength: 1
          type: string
      required:
        - type
        - title
        - status
        - code
        - requestId
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: base-app API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: The service is healthy.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The request exceeded the configured rate limit.
      security: []
      summary: Health check
      x-rate-limit-failure: open
      x-rate-limit-ip-limit: 60
      x-rate-limit-key: ip
      x-rate-limit-limit: 60
      x-rate-limit-window-sec: 60
servers:
  - url: /api
