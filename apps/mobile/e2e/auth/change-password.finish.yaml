appId: ${APP_ID}
---
- evalScript: ${output.changeOtp = MAESTRO_AUTH_OTP}
- evalScript: ${output.newPassword = MAESTRO_NEW_PASSWORD}
- assertVisible:
    id: auth.change-password.code
- tapOn:
    id: auth.change-password.code
- inputText: ${output.changeOtp}
- tapOn:
    id: auth.stage-code
- assertVisible:
    id: auth.new-password
- tapOn:
    id: auth.new-password
- inputText: ${output.newPassword}
- tapOn:
    id: auth.confirm-password
- inputText: ${output.newPassword}
- tapOn:
    id: auth.submit
- assertVisible:
    id: auth.password-updated
