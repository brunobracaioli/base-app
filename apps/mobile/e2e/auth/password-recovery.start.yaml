appId: ${APP_ID}
---
- evalScript: ${output.recoveryEmail = MAESTRO_RECOVERY_EMAIL}
- launchApp:
    clearState: true
- tapOn:
    id: auth.welcome.password
- tapOn:
    id: auth.forgot-password
- tapOn:
    id: auth.email
- inputText: ${output.recoveryEmail}
- tapOn:
    id: auth.submit
- assertVisible:
    id: auth.otp
