appId: ${APP_ID}
---
- evalScript: ${output.signupOtp = MAESTRO_AUTH_OTP}
- evalScript: ${output.signupPassword = MAESTRO_SIGNUP_PASSWORD}
- assertVisible:
    id: auth.otp
- tapOn:
    id: auth.otp
- inputText: ${output.signupOtp}
- tapOn:
    id: auth.submit
- assertVisible:
    id: auth.new-password
- tapOn:
    id: auth.new-password
- inputText: ${output.signupPassword}
- tapOn:
    id: auth.confirm-password
- inputText: ${output.signupPassword}
- tapOn:
    id: auth.submit
- runFlow:
    file: accept-current-terms.yaml
- assertVisible:
    id: app.home
