appId: ${APP_ID}
---
- evalScript: ${output.loginEmail = MAESTRO_LOGIN_EMAIL}
- evalScript: ${output.loginPassword = MAESTRO_LOGIN_PASSWORD}
- launchApp:
    clearState: true
- tapOn:
    id: auth.welcome.password
- tapOn:
    id: auth.email
- inputText: ${output.loginEmail}
- tapOn:
    id: auth.password
- inputText: ${output.loginPassword}
- tapOn:
    id: auth.submit
- assertVisible:
    id: app.home
- tapOn:
    id: app.tab.settings
- tapOn:
    id: settings.manage-account
- tapOn:
    id: settings.change-password
- tapOn:
    id: auth.change-password.start
- assertVisible:
    id: auth.change-password.code
