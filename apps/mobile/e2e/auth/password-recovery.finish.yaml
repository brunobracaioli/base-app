appId: ${APP_ID}
---
- evalScript: ${output.recoveryOtp = MAESTRO_AUTH_OTP}
- evalScript: ${output.recoveryPassword = MAESTRO_RECOVERY_PASSWORD}
- assertVisible:
    id: auth.otp
- tapOn:
    id: auth.otp
- inputText: ${output.recoveryOtp}
- tapOn:
    id: auth.submit
- assertVisible:
    id: auth.new-password
- tapOn:
    id: auth.new-password
- inputText: ${output.recoveryPassword}
- tapOn:
    id: auth.confirm-password
- inputText: ${output.recoveryPassword}
- tapOn:
    id: auth.submit
- assertVisible:
    id: app.home
